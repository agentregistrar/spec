name: Release package

# Tag-driven release: bump `version` in package.json, merge to main, then push
# an annotated `vX.Y.Z` tag on that merge commit. The tag must match the
# package version and point to a commit on main. Publishing uses npm trusted
# publishing (OIDC); no NPM_TOKEN secret is involved. A successful publish also
# creates the GitHub Release from `release-notes-vX.Y.Z.md`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches package and main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::error::$TAG must be an annotated tag"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$TAG does not point to a commit on main"
            exit 1
          fi

          if [ ! -f "release-notes-$TAG.md" ]; then
            echo "::error::missing release-notes-$TAG.md"
            exit 1
          fi

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # Must match the "Environment name" in the npm trusted publisher settings.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for the npm OIDC token exchange
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        # Trusted publishing requires npm >= 11.5.1 (Node >= 22.14).
        run: npm install --global npm@latest

      - name: Publish
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if npm view "@agentregistrar/discovery@$version" version >/dev/null 2>&1; then
            echo "::notice::@agentregistrar/discovery@$version is already published; skipping npm publish"
          else
            npm publish --access public
          fi

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release from tag and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG already exists; skipping"
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "agent-identity-v1 $TAG" \
            --notes-file "release-notes-$TAG.md"
